name: Build LiquidClock26

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'clock26/**'
      - '.github/workflows/build-clock26.yml'

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: macos-14
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_variant: rootless
          - build_variant: roothide

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Bump Package Version
        id: bump
        run: |
          cd clock26
          VERSION="1.0.0-${{ github.run_number }}"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "Using version: $VERSION"
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Prepare Maintainer Scripts
        run: |
          # 仓库里维护脚本没有执行位（部分工作区不支持 chmod），在这里补上
          chmod 0755 clock26/layout/DEBIAN/postinst

      - name: Build Package
        run: |
          cd clock26
          SCHEME="${{ matrix.build_variant }}"
          make clean THEOS_PACKAGE_SCHEME="$SCHEME"
          make package THEOS_PACKAGE_SCHEME="$SCHEME"
          echo "=== .deb files ==="
          find . -name "*.deb" -type f

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clock26-${{ matrix.build_variant }}
          path: clock26/packages/*.deb
          if-no-files-found: error

      - name: Create Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.build_variant == 'roothide'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "iOS26 液态时钟（独立版） v${{ steps.bump.outputs.package_version }}"
          files: clock26/packages/*.deb
