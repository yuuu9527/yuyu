name: StageQuick · RootHide
on:
  workflow_dispatch:
  push:
    branches: [stagequick-roothide]
    paths: ['stagequick/**', '.github/workflows/stagequick.yml']
permissions:
  contents: read
jobs:
  build:
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native RootHide build tools
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew install dpkg ldid make xz
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          export THEOS="$RUNNER_TEMP/theos"
          git clone --quiet https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout -q 958fea4f779943505b15b93c88bb4db8d97b346d
          git -C "$THEOS" submodule update --init --recursive --depth 1 --jobs 4
          mkdir -p "$THEOS/sdks"
          curl -fsSL --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o "$RUNNER_TEMP/sdk.tar.xz"
          echo "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  $RUNNER_TEMP/sdk.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build and inspect deb
        working-directory: stagequick
        shell: bash
        run: |
          set -euo pipefail
          make -j2 package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          deb=$(ls packages/*.deb)
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
          dpkg-deb -c "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/root"
          bin="$RUNNER_TEMP/root/Library/MobileSubstrate/DynamicLibraries/StageQuick.dylib"
          lipo "$bin" -verify_arch arm64 arm64e
          otool -arch arm64e -L "$bin" | tee "$RUNNER_TEMP/libraries"
          grep -F '@loader_path/.jbroot/usr/lib/libsubstrate.dylib' "$RUNNER_TEMP/libraries"
          test "$(find "$RUNNER_TEMP/root" -name '*.dylib' | wc -l)" -eq 1
          shasum -a 256 "$deb"
      - uses: actions/upload-artifact@v4
        with:
          name: StageQuick-RootHide
          path: stagequick/packages/*.deb
          retention-days: 7
          if-no-files-found: error
